name: KissKH Auto Scraper

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install puppeteer axios

      - name: Run Scraper
        run: node scraper.js

      - name: Commit Results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          
          # تأكدنا هنا أن الاسم movies.json ليطابق الكود البرمجي
          git add movies.json
          
          # التحقق من وجود مجلد الترجمات
          if [ -d "subtitles" ]; then
            git add subtitles/*.srt || echo "No subtitles found"
          fi
          
          # الكوميت والرفع
          git commit -m "Update movies data: $(date)" || echo "No changes to commit"
          git push
