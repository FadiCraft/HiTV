name: KissKH Auto Scraper

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install puppeteer axios

      - name: Run Scraper
        # إضافة متغير بيئة للتأكد من تشغيل المتصفح بدون واجهة رسومية
        run: node scraper.js
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'

      - name: Commit Results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          
          # تغيير اسم الملف ليتناسب مع الكود الجديد
          git add kisskh_data.json
          
          if [ -d "subtitles" ]; then
            git add subtitles/*.srt || echo "No subtitles found"
          fi
          
          git commit -m "Update KissKH data: $(date)" || echo "No changes to commit"
          git push
