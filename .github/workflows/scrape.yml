name: HiTV JSON Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run Scraper
        run: node scraper.js

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 1. إضافة التغييرات أولاً (لجعل الـ working directory نظيفاً)
          git add -A
          
          # 2. التحقق من وجود تغييرات فعلاً
          if git diff --staged --quiet; then
            echo "لا توجد تغييرات جديدة للمزامنة."
            exit 0
          fi
          
          # 3. حفظ التغييرات محلياً قبل جلب التحديثات من السيرفر
          git commit -m "Update data and subtitles [skip ci]"
          
          # 4. الآن نقوم بجلب التحديثات ودمجها (لن يحدث خطأ لأن التغييرات أصبحت Commit)
          git pull --rebase origin main
          
          # 5. الرفع النهائي
          git push origin main
